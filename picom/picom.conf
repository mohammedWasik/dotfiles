# Picom configuration - Only Polybar transparent, everything else opaque

# Backend
backend = "glx";
vsync = true;

# Shadows (disabled)
shadow = false;

# Fading (disabled)
fading = false;

# Opacity rules - Polybar background transparent via Polybar config itself
# Keep Polybar at 100% here, transparency handled in Polybar config
opacity-rule = [
    "85: class_g = 'Polybar'"
];


# Background blur (enabled for Polybar only)

blur-background-exclude = [
    "class_g = 'Firefox'",
    "class_g = 'Chrome'",
    "class_g = 'google-chrome'",
    "class_g = 'Chromium'",
    "class_g = 'Cursor'",
    "class_g = 'cursor'",
    "class_g = 'VSCode'",
    "class_g = 'code'"
];
blur-background-frame = false;
blur-background-fixed = false;

# Window type settings - all opaque
wintypes:
{
    tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
    dock = { shadow = false; opacity = 1.0; };
    dnd = { shadow = false; opacity = 1.0; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};

# Performance
detect-rounded-corners = false;
detect-client-opacity = false;
detect-transient = false;
detect-client-leader = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Focused window detection
use-damage = true;
log-level = "warn";

# Exclude problematic apps
unredir-if-possible = true;
unredir-if-possible-exclude = [
    "class_g = 'Cursor'",
    "class_g = 'cursor'",
    "class_g = 'google-chrome'",
    "class_g = 'Google-chrome'",
    "class_g = 'Chrome'",
    "class_g = 'flameshot'",
    "class_g = 'Flameshot'"
];
