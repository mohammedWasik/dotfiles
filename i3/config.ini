 # i3 Window Manager Configuration
# Standalone i3 with dual monitor, Gruvbox theme, custom keybindings

###############################################################################
# Core Settings
###############################################################################

set $mod Mod4

font pango:FiraCode Nerd Font Medium 12
focus_follows_mouse no

# Enable Super+drag to move/resize windows and move between monitors
floating_modifier $mod
mouse_warping output

###############################################################################
# Application Variables
###############################################################################

set $terminal ghostty
set $file_manager thunar
set $browser google-chrome --disable-gpu-sandbox --disable-software-rasterizer 2>/dev/null || google-chrome 2>/dev/null

###############################################################################
# Appearance: Gruvbox Colors
###############################################################################

set $bg #282828
set $red #cc241d
set $gray #a89984
set $darkgray #1d2021
set $orange #fabd2f

# Window border colors (orange for focused)
client.focused          $orange $orange $orange $orange $orange
client.focused_inactive $darkgray $darkgray $gray $darkgray $darkgray
client.unfocused        $darkgray $darkgray $gray $darkgray $darkgray
client.urgent           $red $red $bg $red $red

###############################################################################
# Appearance: Gaps & Borders
###############################################################################

gaps inner 2
gaps outer 3
smart_gaps off

default_border pixel 3
default_floating_border pixel 3
for_window [class="^.*"] border pixel 3

###############################################################################
# Dual Monitor: Static Workspace Assignments
###############################################################################

# Fixed dual-monitor setup: laptop (eDP-1) + external (DP-2)
# Note: DP-2 is on the left, eDP-1 (laptop) is on the right
workspace 1 output DP-2
workspace 2 output DP-2
workspace 3 output DP-2
workspace 4 output DP-2
workspace 5 output DP-2
workspace 6 output eDP-1
workspace 7 output eDP-1
workspace 8 output eDP-1
workspace 9 output eDP-1
workspace 10 output eDP-1

# Configure monitor layout using screenlayout script (editable via arandr)
exec_always --no-startup-id ~/.screenlayout/extLapCon.sh

###############################################################################
# Window Rules
###############################################################################

for_window [urgent=latest] focus
# Keep polybar bars always on top
for_window [class="^Polybar$"] floating enable, move position 0 0, resize set 100% 36, sticky enable, border none

###############################################################################
# Workspace Behavior
###############################################################################

workspace_auto_back_and_forth yes
bindsym Control+Mod1+Right workspace next_on_output
bindsym Control+Mod1+Left workspace prev_on_output
bindsym $mod+Shift+b move container to workspace back_and_forth; workspace back_and_forth

###############################################################################
# Keybindings: Application Launches
###############################################################################

bindsym $mod+Return exec $terminal
bindsym $mod+r exec --no-startup-id sh -c "rofi -show drun -theme ~/.config/rofi/launchers/type-5/style-4.rasi 2>/dev/null || rofi -show drun 2>/dev/null"
bindsym $mod+w exec --no-startup-id sh -c "rofi -show window -theme ~/.config/rofi/launchers/type-5/style-4.rasi 2>/dev/null || rofi -show window 2>/dev/null"
bindsym $mod+e exec $file_manager
bindsym $mod+F3 exec $file_manager
bindsym $mod+b exec --no-startup-id sh -c "$browser &"

###############################################################################
# Keybindings: Window Focus & Navigation
###############################################################################

bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+semicolon focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+a focus parent
bindsym $mod+space focus mode_toggle

###############################################################################
# Keybindings: Window Movement
###############################################################################

bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+semicolon move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

###############################################################################
# Keybindings: Window Layout & Management
###############################################################################

bindsym $mod+h split h; exec notify-send 'tile horizontally'
bindsym $mod+v split v; exec notify-send 'tile vertically'
bindsym $mod+s layout stacking
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+Shift+q kill

###############################################################################
# Keybindings: Workspaces (1-10)
###############################################################################

# Workspace output assignments are handled dynamically by detect-monitors.sh
# No hardcoded assignments needed

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Workspace switching
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev

# Window switching (Alt+Tab behavior)
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev

###############################################################################
# Keybindings: System & Utilities
###############################################################################

bindsym $mod+l exec --no-startup-id i3lock --color=000000 --nofork
bindsym $mod+m bar mode toggle
bindsym $mod+d mode "resize"
bindsym $mod+Ctrl+m exec pavucontrol
bindsym $mod+Ctrl+x --release exec --no-startup-id xkill
# Screenshot binding (Print key)
bindsym Print exec --no-startup-id ~/.config/i3/scripts/screenshot.sh

# Picom compositor: toggle and restart (silent logs)
# DISABLED - causes hangs during video calls
# bindsym $mod+t exec --no-startup-id pkill picom
# bindsym $mod+Ctrl+t exec --no-startup-id picom -b

###############################################################################
# Function Keys: Audio Controls
###############################################################################

# Volume controls (F1-F3 or XF86Audio keys) - Each press creates unique notification
bindsym XF86AudioRaiseVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh up
bindsym XF86AudioLowerVolume exec --no-startup-id ~/.config/i3/scripts/volume.sh down
bindsym XF86AudioMute exec --no-startup-id sh -c 'pactl set-sink-mute @DEFAULT_SINK@ toggle && notify-send -t 1000 "🔇 Muted"' 2>/dev/null || true

# Microphone mute
bindsym XF86AudioMicMute exec --no-startup-id ~/.config/i3/scripts/volume.sh mic-toggle

###############################################################################
# Function Keys: Brightness Controls
###############################################################################

# Brightness controls (F4-F6 or XF86MonBrightness keys)
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.config/i3/scripts/brightness.sh up
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/i3/scripts/brightness.sh down

###############################################################################
# Function Keys: Media Controls
###############################################################################

# Media controls (F7-F9 or XF86Audio keys)
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioStop exec --no-startup-id playerctl stop

###############################################################################
# Function Keys: Bluetooth & Wireless
###############################################################################

# Bluetooth toggle (F10 or custom)
bindsym XF86Bluetooth exec --no-startup-id sh -c 'if bluetoothctl show | grep -q "Powered: yes"; then bluetoothctl power off; else bluetoothctl power on; fi' 2>/dev/null || true

# Wireless toggle (if needed)
bindsym XF86WLAN exec --no-startup-id sh -c 'if nmcli radio wifi | grep -q "enabled"; then nmcli radio wifi off; else nmcli radio wifi on; fi' 2>/dev/null || true

###############################################################################
# Function Keys: Settings & Display
###############################################################################

# Display settings (F11 or XF86Display)
bindsym XF86Display exec --no-startup-id sh -c 'arandr 2>/dev/null || gnome-control-center display 2>/dev/null' || true

# Settings/Control Center (F12 or custom)
bindsym XF86Tools exec --no-startup-id sh -c 'gnome-control-center 2>/dev/null || xfce4-settings-manager 2>/dev/null' || true

###############################################################################
# Keybindings: i3 Management
###############################################################################

bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

###############################################################################
# Mouse Bindings: Super+Drag for Moving/Resizing Windows
###############################################################################

# Super+Left mouse button: Move floating windows
bindsym $mod+button1 move floating

# Super+Right mouse button: Resize floating windows
bindsym $mod+button3 resize floating

###############################################################################
# Modes
###############################################################################

mode "resize" {
    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt
    bindsym j resize shrink width 1 px or 1 ppt
    bindsym k resize grow height 1 px or 1 ppt
    bindsym l resize shrink height 1 px or 1 ppt
    bindsym semicolon resize grow width 1 px or 1 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

set $mode_system (l)ock, (e)xit, switch_(u)ser, (s)uspend, (h)ibernate, (r)eboot, (Shift+s)hutdown
bindsym $mod+Escape mode "$mode_system"
mode "$mode_system" {
    bindsym l exec --no-startup-id i3lock --color=000000 --nofork; mode "default"
    bindsym s exec --no-startup-id systemctl suspend; mode "default"
    bindsym h exec --no-startup-id systemctl hibernate; mode "default"
    bindsym r exec --no-startup-id systemctl reboot; mode "default"
    bindsym Shift+s exec --no-startup-id systemctl poweroff; mode "default"
    bindsym e exec --no-startup-id i3-msg exit; mode "default"
    bindsym u exec --no-startup-id dm-tool switch-to-greeter; mode "default"
        bindsym Return mode "default"
        bindsym Escape mode "default"
}

###############################################################################
# Status Bar (Polybar)
###############################################################################

# Initialize polybar and system settings on startup
exec_always --no-startup-id ~/.config/i3/scripts/session-init.sh



bindsym $mod+Shift+v exec diodon

###############################################################################
# Autostart Applications
###############################################################################

exec --no-startup-id nitrogen --restore
exec --no-startup-id volumeicon
exec --no-startup-id nm-applet
exec --no-startup-id ~/.config/i3/scripts/battery-alert.sh












