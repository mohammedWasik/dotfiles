[bar/secondary-right]
monitor = DP-2
width = 415px
height = 36
offset-x = 1493
offset-y = 8
radius = 10
background = ${colors.dark-pill}
foreground = ${colors.foreground}
padding-left = 6
padding-right = 6
module-margin-left = 2
module-margin-right = 2
font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:style=Bold:size=11;2"
font-2 = "Noto Color Emoji:size=10;2"
modules-center = cpu memory temperature battery volume
wm-restack = i3
override-redirect = true
cursor-click = pointer

; ============================================================================
; Modules
; ============================================================================

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 80
format-prefix = " "
format-prefix-foreground = ${colors.gruvbox-red}
format = <label>
label = %percentage%%
label-foreground = ${colors.gruvbox-red}
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.alert}
format-warn = <label-warn>
label-warn = %percentage%%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 75
format-prefix = " "
format-prefix-foreground = ${colors.gruvbox-yellow}
format = <label>
label = %percentage_used%%
label-foreground = ${colors.gruvbox-yellow}
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.gruvbox-orange}
format-warn = <label-warn>
label-warn = %percentage_used%%
label-warn-foreground = ${colors.gruvbox-orange}

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 6
warn-temperature = 75
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.gruvbox-yellow}
label = %temperature-c%
label-foreground = ${colors.foreground}
format-warn = <label-warn>
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-threshold = 15

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.gruvbox-green}
label-charging = %percentage%%
label-charging-foreground = ${colors.gruvbox-green}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.gruvbox-green}
ramp-capacity-0 = 
ramp-capacity-2 = 
ramp-capacity-4 = 

format-full-prefix = " "
format-full-prefix-foreground = ${colors.gruvbox-green}
format-full = <label-full>
label-full = 100%
label-full-foreground = ${colors.gruvbox-green}

format-low = <label-low>
format-low-prefix = " "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%%
label-low-foreground = ${colors.alert}

[module/volume]
type = internal/pulseaudio
interval = 1
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.gruvbox-blue}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.gruvbox-blue}
label-muted =  muted
label-muted-foreground = ${colors.alert}

[module/date-local]
type = internal/date
timezone = Asia/Dhaka
interval = 1
date = %Y-%m-%d
time = %I:%M %p %Z
format-prefix = " "
format-prefix-foreground = ${colors.gruvbox-yellow}
format = <label>
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.gruvbox-yellow}

label-focused = %index%
label-focused-underline = ${colors.gruvbox-yellow}
label-focused-underline-size = 3
label-focused-padding = 2
label-focused-foreground = ${colors.gruvbox-yellow}

label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.foreground-dim}

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-border = over
pseudo-transparency = true

; ============================================================================
; Mode-banner bars (bottom-center) — only spawned when in a non-default mode
; ============================================================================

[bar/secondary-mode-banner]
monitor = DP-2
width = 900px
height = 40
offset-x = 510
offset-y = 1020
radius = 15
background = ${colors.gruvbox-yellow}
foreground = #000
padding-left = 16
padding-right = 16
module-margin-left = 0
module-margin-right = 0
font-0 = "FiraCode Nerd Font:style=Bold:size=12;2"
modules-center = i3-mode-only
wm-restack = i3
override-redirect = true
cursor-click = pointer

[bar/primary-mode-banner]
monitor = eDP-1
width = 900px
height = 40
offset-x = 510
offset-y = 1020
radius = 15
background = ${colors.gruvbox-yellow}
foreground = #000
padding-left = 16
padding-right = 16
module-margin-left = 0
module-margin-right = 0
font-0 = "FiraCode Nerd Font:style=Bold:size=12;2"
modules-center = i3-mode-only
wm-restack = i3
override-redirect = true
cursor-click = pointer

[module/i3-mode-only]
type = internal/i3
format = <label-mode>
label-mode = %mode%
label-mode-foreground = #000
label-mode-padding = 0
