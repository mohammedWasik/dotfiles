; Polybar configuration - multi-bar per monitor for true rounded pills.
; Each pill is its own polybar instance with bar-level `radius` so Cairo
; renders real arcs on the corners (no font-glyph fakery).
;
; Bar naming:
;   primary-*   -> eDP-1 (laptop)
;   secondary-* -> DP-2  (external)

[global/wm]
margin-top = 1
margin-bottom = 1

[colors]
background     = #1e1e20
foreground     = #ebdbb2
foreground-dim = #a89984
alert          = #cc241d
gruvbox-red    = #fb4934
gruvbox-green  = #b8bb26
gruvbox-yellow = #fabd2f
gruvbox-blue   = #83a598
gruvbox-aqua   = #8ec07c
gruvbox-orange = #fe8019
coral          = #e63946
dark-pill      = #3c3836

; ============================================================================
; PRIMARY MONITOR: eDP-1 (laptop)
; ============================================================================

[bar/primary-left]
monitor = eDP-1
width = 275px
height = 36
offset-x = 12
offset-y = 8
radius = 10
background = ${colors.dark-pill}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin-left = 0
module-margin-right = 0
font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:style=Bold:size=11;2"
font-2 = "Noto Color Emoji:size=10;2"
modules-center = date-local
wm-restack = i3
override-redirect = true
cursor-click = pointer

[bar/primary-center]
monitor = eDP-1
width = ${env:POLYBAR_CENTER_WIDTH:480}
height = 36
offset-x = ${env:POLYBAR_CENTER_OFFSET_X:720}
offset-y = 8
radius = 10
background = ${colors.dark-pill}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin-left = 0
module-margin-right = 0
font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:style=Bold:size=11;2"
font-2 = "Noto Color Emoji:size=10;2"
modules-center = i3
wm-restack = i3
override-redirect = true
cursor-click = pointer

[bar/primary-right]
monitor = eDP-1
width = 415px
height = 36
offset-x = 1493
offset-y = 8
radius = 10
background = ${colors.dark-pill}
foreground = ${colors.foreground}
padding-left = 6
padding-right = 6
module-margin-left = 2
module-margin-right = 2
font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:style=Bold:size=11;2"
font-2 = "Noto Color Emoji:size=10;2"
modules-center = cpu memory temperature battery volume
wm-restack = i3
override-redirect = true
cursor-click = pointer

