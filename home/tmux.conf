unbind r

bind r source-file ~/.tmux.conf 
set-option -g prefix M-s
set -g mouse on
set -g focus-events on
unbind -T root MouseDown1Status
bind -T root MouseDown1Status select-window -t=
bind -T root MouseUp1Status select-window -t=
bind -T copy-mode-vi MouseDown1Status select-window -t=

setw -g mode-keys vi

# bind 'y' in copy-mode to copy selection to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# optional: paste tmux buffer inside tmux
bind p paste-buffer



bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R 

set-option -g status-position top

# Gruvbox colors
# bg=#282828  bg1=#3c3836  bg2=#504945
# fg=#ebdbb2  gray=#928374
# yellow=#d79921  orange=#d65d0e  red=#cc241d
# green=#98971a  aqua=#689d6a   blue=#458588  purple=#b16286

# Status bar
set -g status-style bg=#3c3836,fg=#ebdbb2
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#928374] %H:%M "
set -g status-right-length 20

# Windows in status bar — show folder name
set -g window-status-format         "#[fg=#928374] #I:#W "
set -g window-status-current-format "#[bg=#d79921,fg=#282828,bold] #I:#W #[default]"

# Auto-rename window to current folder (not full path)
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Pane borders
set -g pane-border-style        fg=#504945
set -g pane-active-border-style fg=#d79921

# Faster pane switching feel
set -g display-panes-time 2000

# Alt+0-9: jump to window or create it if missing
bind -n M-0 run "tmux select-window -t :0 2>/dev/null || tmux new-window -t :0"
bind -n M-1 run "tmux select-window -t :1 2>/dev/null || tmux new-window -t :1"
bind -n M-2 run "tmux select-window -t :2 2>/dev/null || tmux new-window -t :2"
bind -n M-3 run "tmux select-window -t :3 2>/dev/null || tmux new-window -t :3"
bind -n M-4 run "tmux select-window -t :4 2>/dev/null || tmux new-window -t :4"
bind -n M-5 run "tmux select-window -t :5 2>/dev/null || tmux new-window -t :5"
bind -n M-6 run "tmux select-window -t :6 2>/dev/null || tmux new-window -t :6"
bind -n M-7 run "tmux select-window -t :7 2>/dev/null || tmux new-window -t :7"
bind -n M-8 run "tmux select-window -t :8 2>/dev/null || tmux new-window -t :8"
bind -n M-9 run "tmux select-window -t :9 2>/dev/null || tmux new-window -t :9"

# Alt+Left/Right: cycle windows with wrap-around
bind -n M-Left  select-window -p
bind -n M-Right select-window -n
set -g wrap-search on

set -ga terminal-overrides ",xterm-256color:Ss=\E[%p1%d q:Se=\E[2 q"
set -ga terminal-overrides ",tmux-256color:Ss=\E[%p1%d q:Se=\E[2 q"
